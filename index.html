        <span class="blob blob-1"></span>

    <header>
        <a href="#hero">

                < <div class="logo-t"></div><div class="logo-e"><div class="logo-e-line"></div><div class="logo-e-line"></div><div class="logo-e-line"></div></div>>
            </div>
        </a>
        <div class="mode-toggle">
            <span id="mode-label">studio</span>
            <button id="switchMode"></button>
        </div>

    <section id="hero">
        <span id="hero-eyebrow" class="eyebrow"></span>

            <button class="filter-chip" data-filter="cyber">Cyber</button>
            <button class="filter-chip" data-filter="others">Others</button>

    <section id="contact">

        <h2 class="heading">Let's talk</h2>
        <div id="contact-body">
            <form action="" method="post">

                <p>Your email</p>

                <textarea name="" id="" required></textarea>

                <button type="submit">Send message</button>

            <div class="links" style="display: flex; flex-direction: column;">
                <a href="mailto:egbewaletoluwani12@gmail.com">egbewaletoluwani12@gmail.com</a>

                <a href="https://www.linkedin.com/in/toluwani-egbewale-62b331400">LinkedIn</a>
                <a href="https://wa.me/2348104791861">WhatsApp</a>
                <a href="https://x.com/toluegbewale">Twitter / X</a>
            </div>
        </div>

    <footer class="site-footer">© Toluwani Egbewale — built by hand, not by template</footer>
